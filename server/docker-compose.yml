name: bug-stream

# All settings live in .env (copy .env.example). The main one is APP_DOMAIN: the subdomain you were given.
# Only the site (nginx) is published; the database and the backend are reachable only inside the Docker network.

services:
  db:
    image: ${DOCKER_REGISTRY:-}postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql
    # The database port is not published. For maintenance uncomment (127.0.0.1 only):
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Java 25 + Spring Boot 4.1. Flyway migrations run automatically on start.
  backend:
    build:
      context: ./backend
      args:
        REGISTRY: ${DOCKER_REGISTRY:-}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set it in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      # where API calls may come from: the site itself and the Chrome extension (narrow to chrome-extension://<ID> after packing)
      CORS_ORIGINS: ${CORS_ORIGINS:-https://${APP_DOMAIN},chrome-extension://*}
      STORAGE_ROOT: /data/storage
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://${APP_DOMAIN}}
      INTEGRATION_SECRET: ${INTEGRATION_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-bugstream@localhost}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      JIRA_STATUS_SYNC: ${JIRA_STATUS_SYNC:-PT5M}
      LDAP_URL: ${LDAP_URL:-}
      LDAP_BASE_DN: ${LDAP_BASE_DN:-}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      LDAP_USER_FILTER: ${LDAP_USER_FILTER:-}
      LDAP_GROUP_ROLES: ${LDAP_GROUP_ROLES:-}
      LDAP_DEFAULT_ROLE: ${LDAP_DEFAULT_ROLE:-DEVELOPER}
      JAVA_OPTS: ${JAVA_OPTS:-}
      TZ: ${TZ:-UTC}
    volumes:
      - ${STORAGE_DIR:-./storage}:/data/storage     # report videos and screenshots
      - ./certs/ca:/etc/bugstream/ca:ro              # corporate CA certificates (LDAPS, outgoing proxy), optional
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  # Site (React) + widget /widget/bug-stream.js + extension /extension/; /api is proxied to the backend.
  frontend:
    build:
      context: ./frontend
      args:
        REGISTRY: ${DOCKER_REGISTRY:-}
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set it in .env — the subdomain, e.g. bugs.example.com}
      TLS_MODE: ${TLS_MODE:-proxy}
      TLS_CERT: ${TLS_CERT:-fullchain.pem}
      TLS_KEY: ${TLS_KEY:-privkey.pem}
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./extension-dist:/usr/share/nginx/extension:ro   # adtask.crx + update.xml (extension/scripts/pack-extension.ps1)
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - backend

volumes:
  pgdata:

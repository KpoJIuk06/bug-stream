# Shared part for http and https.
root /usr/share/nginx/html;
index index.html;
server_tokens off;

# Report videos can be large: 30 minutes ≈ 340 MB, with headroom
client_max_body_size 1100m;

include /etc/nginx/snippets/security-headers.conf;

# API and files go to the backend
location /api/ {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $bs_proto;
    proxy_request_buffering off;   # video is streamed, no intermediate file
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# Widget for sites: <script src="https://<domain>/widget/bug-stream.js">.
# CORS * — so sites can include it with integrity (SRI). Always the latest version.
location /widget/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    try_files $uri =404;
}

# Chrome extension for installation via group policy (extension/docs/deploy.md):
# folder server/extension-dist → adtask.crx and update.xml
location /extension/ {
    include /etc/nginx/snippets/security-headers.conf;
    alias /usr/share/nginx/extension/;
    types {
        application/x-chrome-extension crx;
        application/xml xml;
    }
    add_header Cache-Control "no-cache" always;
}

# Built files with a hash in the name
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# SPA: all other paths → index.html
location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
